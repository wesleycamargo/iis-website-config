<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Machine Info</title>
</head>
<body>
  <h1>Machine Info</h1>
  <p>Served by IIS using Server Side Includes (SSI)</p>

  <table>
    <tr>
      <td>Hostname</td>
      <td><!--#echo var="SERVER_NAME" --></td>
    </tr>
    <tr>
      <td>Server IP</td>
      <td><!--#echo var="LOCAL_ADDR" --></td>
    </tr>
    <tr>
      <td>Server Port</td>
      <td><!--#echo var="SERVER_PORT" --></td>
    </tr>
    <tr>
      <td>Timestamp (UTC)</td>
      <td><!--#echo var="DATE_GMT" --></td>
    </tr>
  </table>
</body>
</html>
